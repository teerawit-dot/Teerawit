<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Simple Mobile AR Lab - Many Goldfish</title>

  <!-- Open-source libraries. The versions are pinned so A-Frame and AR.js match. -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
    }

    #top-panel {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(92vw, 520px);
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.68);
      color: white;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 18px;
      z-index: 20;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 0 12px;
    }

    button {
      min-width: 132px;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    #run-button { background: #ffffff; color: #111111; }
    #status-button { background: #ffd54f; color: #111111; }

    .hint {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.8;
    }
  </style>

  <script>
    // Component สำหรับหมุนวัตถุ (เอาไว้ให้ปลาว่ายวนเป็นวงกลม)
    AFRAME.registerComponent('spin-control', {
      schema: {
        axis: { type: 'string', default: 'y' },
        speed: { type: 'number', default: 90 }, 
        active: { type: 'boolean', default: true }
      },

      tick: function (_time, deltaMs) {
        if (!this.data.active || !deltaMs) return;

        const radians = THREE.MathUtils.degToRad(this.data.speed * deltaMs / 1000);
        const axis = this.data.axis;

        if (axis === 'x') this.el.object3D.rotation.x += radians;
        if (axis === 'y') this.el.object3D.rotation.y += radians;
        if (axis === 'z') this.el.object3D.rotation.z += radians;
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const marker = document.querySelector('#hiro-marker');
      const warningLamp = document.querySelector('#warning-lamp');
      const arLabel = document.querySelector('#ar-label');
      const topPanel = document.querySelector('#top-panel');
      const runButton = document.querySelector('#run-button');
      const statusButton = document.querySelector('#status-button');

      let running = true;
      let warning = false;

      marker.addEventListener('markerFound', () => {
        topPanel.innerHTML = 'พบ Hiro Marker แล้ว — ฝูงปลาทองพร้อมใช้งาน<span class="hint">แตะปุ่มด้านล่างเพื่อทดลองควบคุม</span>';
      });

      marker.addEventListener('markerLost', () => {
        topPanel.innerHTML = 'เล็งกล้องไปที่ Hiro Marker<span class="hint">วาง Marker บนโต๊ะที่มีแสงเพียงพอและให้เห็นกรอบดำครบทั้งสี่ด้าน</span>';
      });

      // ควบคุมการว่ายน้ำของปลา "ทุกตัว"
      runButton.addEventListener('click', () => {
        running = !running;
        document.querySelectorAll('.fish-assembly').forEach(fish => {
          fish.setAttribute('spin-control', 'active', running);
        });
        runButton.textContent = running ? 'หยุดว่ายน้ำ' : 'เริ่มว่ายน้ำ';
      });

      // ควบคุมสถานะ สีของปลาทุกตัว และไฟแจ้งเตือน
      statusButton.addEventListener('click', () => {
        warning = !warning;
        
        // กำหนดสี: แจ้งเตือน = สีแดง, ปกติ = สีส้มทอง
        const newColor = warning ? '#ff3333' : '#FF9800'; 

        // เปลี่ยนสีลำตัวและหางของปลาทุกตัว
        document.querySelectorAll('.fish-body, .fish-tail').forEach(part => {
          part.setAttribute('color', newColor);
        });

        if (warning) {
          warningLamp.setAttribute('color', '#ff1744');
          warningLamp.setAttribute('material', 'emissive', '#ff1744');
          arLabel.setAttribute('value', 'GOLDFISH\nSTATUS: WARNING');
          statusButton.textContent = 'เปลี่ยนเป็นปกติ';
        } else {
          warningLamp.setAttribute('color', '#00e676');
          warningLamp.setAttribute('material', 'emissive', '#00c853');
          arLabel.setAttribute('value', 'GOLDFISH\nSTATUS: NORMAL');
          statusButton.textContent = 'จำลองคำเตือน';
        }
      });
    });
  </script>
</head>

<body>
  <div id="top-panel">
    เล็งกล้องไปที่ Hiro Marker
    <span class="hint">อนุญาตให้เว็บไซต์ใช้กล้องเมื่อเบราว์เซอร์ถาม</span>
  </div>

  <div id="controls">
    <button id="run-button" type="button">หยุดว่ายน้ำ</button>
    <button id="status-button" type="button">จำลองคำเตือน</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false"
  >
    <a-marker
      id="hiro-marker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smooth-count="8"
      smooth-tolerance="0.01"
      smooth-threshold="3"
    >
      <!-- ฐานสำหรับวางปลา (บ่อน้ำจำลอง) -->
      <a-cylinder
        position="0 0.04 0"
        radius="0.9"
        height="0.05"
        color="#0288d1"
        roughness="0.2"
        opacity="0.8"
      ></a-cylinder>

      <!-- ปลาตัวที่ 1 (วงในสุด ว่ายเร็วสุด) -->
      <a-entity class="fish-assembly" position="0 0.3 0" rotation="0 0 0" spin-control="axis: y; speed: 130; active: true">
        <a-entity position="0.35 0 0" scale="0.7 0.7 0.7">
          <a-sphere class="fish-body" position="0 0 0" radius="0.4" scale="1 0.6 0.35" color="#FF9800"></a-sphere>
          <a-cone class="fish-tail" position="-0.4 0 0" rotation="0 0 -90" radius-bottom="0.25" radius-top="0.02" height="0.3" color="#FF9800" scale="1 1 0.3"></a-cone>
          <a-sphere position="0.2 0.1 0.13" radius="0.06" color="#ffffff"><a-sphere position="0.02 0 0.04" radius="0.03" color="#000000"></a-sphere></a-sphere>
          <a-sphere position="0.2 0.1 -0.13" radius="0.06" color="#ffffff"><a-sphere position="0.02 0 -0.04" radius="0.03" color="#000000"></a-sphere></a-sphere>
        </a-entity>
      </a-entity>

      <!-- ปลาตัวที่ 2 (วงนอก ว่ายช้าลง) -->
      <a-entity class="fish-assembly" position="0 0.5 0" rotation="0 120 0" spin-control="axis: y; speed: 90; active: true">
        <a-entity position="0.65 0 0" scale="0.9 0.9 0.9">
          <a-sphere class="fish-body" position="0 0 0" radius="0.4" scale="1 0.6 0.35" color="#FF9800"></a-sphere>
          <a-cone class="fish-tail" position="-0.4 0 0" rotation="0 0 -90" radius-bottom="0.25" radius-top="0.02" height="0.3" color="#FF9800" scale="1 1 0.3"></a-cone>
          <a-sphere position="0.2 0.1 0.13" radius="0.06" color="#ffffff"><a-sphere position="0.02 0 0.04" radius="0.03" color="#000000"></a-sphere></a-sphere>
          <a-sphere position="0.2 0.1 -0.13" radius="0.06" color="#ffffff"><a-sphere position="0.02 0 -0.04" radius="0.03" color="#000000"></a-sphere></a-sphere>
        </a-entity>
      </a-entity>

      <!-- ปลาตัวที่ 3 (ระดับบนสุด ว่ายด้วยความเร็วปานกลาง) -->
      <a-entity class="fish-assembly" position="0 0.7 0" rotation="0 240 0" spin-control="axis: y; speed: 110; active: true">
        <a-entity position="0.5 0 0" scale="0.8 0.8 0.8">
          <a-sphere class="fish-body" position="0 0 0" radius="0.4" scale="1 0.6 0.35" color="#FF9800"></a-sphere>
          <a-cone class="fish-tail" position="-0.4 0 0" rotation="0 0 -90" radius-bottom="0.25" radius-top="0.02" height="0.3" color="#FF9800" scale="1 1 0.3"></a-cone>
          <a-sphere position="0.2 0.1 0.13" radius="0.06" color="#ffffff"><a-sphere position="0.02 0 0.04" radius="0.03" color="#000000"></a-sphere></a-sphere>
          <a-sphere position="0.2 0.1 -0.13" radius="0.06" color="#ffffff"><a-sphere position="0.02 0 -0.04" radius="0.03" color="#000000"></a-sphere></a-sphere>
        </a-entity>
      </a-entity>

      <!-- Status lamp (ไฟสถานะด้านบนสุด) -->
      <a-sphere
        id="warning-lamp"
        position="0 1.2 0"
        radius="0.075"
        color="#00e676"
        material="emissive: #00c853; emissiveIntensity: 0.8"
      ></a-sphere>

      <!-- AR information label -->
      <a-text
        id="ar-label"
        value="GOLDFISH\nSTATUS: NORMAL"
        position="0 1.45 0"
        rotation="-90 0 0"
        align="center"
        width="2.4"
        color="#ffffff"
        side="double"
      ></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
