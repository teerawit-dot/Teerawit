<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Simple Mobile AR Lab - Screen Bounded Goldfish</title>

  <!-- Open-source libraries -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
    }

    #top-panel {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: min(92vw, 520px);
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.68);
      color: white;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    .controls-container {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 18px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
    }

    .main-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      min-width: 132px;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    #run-button { background: #ffffff; color: #111111; }
    #status-button { background: #ffd54f; color: #111111; }

    .sliders-panel {
      background: rgba(0, 0, 0, 0.68);
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(92vw, 400px);
      backdrop-filter: blur(4px);
    }

    .slider-row {
      display: flex;
      align-items: center;
      color: white;
      font-size: 14px;
      font-weight: bold;
    }

    .slider-row label {
      width: 50px;
    }

    .slider-row input[type=range] {
      flex: 1;
      margin-left: 10px;
      accent-color: #FF9800;
    }

    .hint {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.8;
      font-weight: normal;
    }
  </style>

  <script>
    // 1. Component ควบคุมการว่ายแบบจำกัดให้อยู่ในพื้นที่หน้าจอ/กล้อง
    AFRAME.registerComponent('screen-bounded-swim', {
      schema: {
        speed: { type: 'number', default: 100 },
        active: { type: 'boolean', default: true },
        boundsRadius: { type: 'number', default: 0.4 }, // บีบรัศมีให้อยู่ตรงกลาง Marker
        minY: { type: 'number', default: 0.15 },
        maxY: { type: 'number', default: 0.45 }
      },
      init: function() {
        this.target = new THREE.Vector3();
        this.dummy = new THREE.Object3D();
        this.setNewTarget();
      },
      setNewTarget: function() {
        // สุ่มจุดเป้าหมายใหม่อยู่ในระยะแคบๆ ตรงกลาง
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * this.data.boundsRadius;
        this.target.x = Math.cos(angle) * radius;
        this.target.z = Math.sin(angle) * radius;
        this.target.y = this.data.minY + Math.random() * (this.data.maxY - this.data.minY);
      },
      tick: function (time, delta) {
        if (!this.data.active || delta === 0) return;

        const el = this.el;
        const pos = el.object3D.position;

        // คำนวณระยะห่างจากจุดศูนย์กลาง (ระนาบ XZ)
        const distFromCenter = Math.sqrt(pos.x * pos.x + pos.z * pos.z);

        // ถ้าออกนอกรัศมีขอบเขต ให้บังคับจุดเป้าหมายกลับเข้าหาศูนย์กลาง
        if (distFromCenter > this.data.boundsRadius + 0.1) {
          this.target.set(0, (this.data.minY + this.data.maxY) / 2, 0);
        } else if (pos.distanceTo(this.target) < 0.15) {
          this.setNewTarget();
        }

        // ค่อยๆ หันหน้าไปทิศทางเป้าหมาย
        this.dummy.position.copy(pos);
        this.dummy.lookAt(this.target);
        
        const turnSpeed = 3.5 * (delta / 1000); // หันตัวไวขึ้นเล็กน้อยเมื่อถึงขอบ
        el.object3D.quaternion.slerp(this.dummy.quaternion, turnSpeed);

        // ว่ายตรงไปข้างหน้าตามแกน -Z
        const moveSpeed = (this.data.speed / 600) * (delta / 1000);
        el.object3D.translateZ(-moveSpeed);
      }
    });

    // 2. Component อนิเมชันส่ายหาง
    AFRAME.registerComponent('fish-animation', {
      schema: { 
        speed: { type: 'number', default: 100 }, 
        active: { type: 'boolean', default: true } 
      },
      init: function() {
        const tailEl = this.el.querySelector('.tail-pivot');
        if (tailEl) this.tail = tailEl.object3D;
      },
      tick: function (time, delta) {
        if (!this.data.active || this.data.speed === 0) return;
        
        const speedFactor = this.data.speed / 100;
        if (this.tail) {
           this.tail.rotation.y = Math.sin(time * 0.015 * Math.max(speedFactor, 0.4)) * 0.4;
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const marker = document.querySelector('#hiro-marker');
      const warningLamp = document.querySelector('#warning-lamp');
      const arLabel = document.querySelector('#ar-label');
      const topPanel = document.querySelector('#top-panel');
      
      const runButton = document.querySelector('#run-button');
      const statusButton = document.querySelector('#status-button');
      
      let running = true;
      let warning = false;

      marker.addEventListener('markerFound', () => {
        topPanel.innerHTML = 'พบ Hiro Marker แล้ว — ปลาจะว่ายวนอยู่เฉพาะกลางหน้าจอ<span class="hint">ปรับความเร็วการว่ายของแต่ละตัวได้ตามต้องการ</span>';
      });
      marker.addEventListener('markerLost', () => {
        topPanel.innerHTML = 'เล็งกล้องไปที่ Hiro Marker<span class="hint">วาง Marker บนโต๊ะที่มีแสงเพียงพอและให้เห็นกรอบดำครบ</span>';
      });

      // Slider ควบคุมความเร็ว
      [1, 2, 3].forEach(id => {
        const slider = document.getElementById(`speed${id}`);
        const model = document.getElementById(`fish${id}`);

        slider.addEventListener('input', (e) => {
          const currentSpeed = parseFloat(e.target.value);
          model.setAttribute('screen-bounded-swim', 'speed', currentSpeed);
          model.setAttribute('fish-animation', 'speed', currentSpeed);
        });
      });

      // ปุ่มเริ่ม/หยุด
      runButton.addEventListener('click', () => {
        running = !running;
        document.querySelectorAll('.fish-entity').forEach(model => {
          model.setAttribute('screen-bounded-swim', 'active', running);
          model.setAttribute('fish-animation', 'active', running);
        });
        runButton.textContent = running ? 'หยุดว่ายน้ำ' : 'เริ่มว่ายน้ำ';
      });

      // ปุ่มจำลองคำเตือน
      statusButton.addEventListener('click', () => {
        warning = !warning;
        
        const newColor = warning ? '#ff3333' : '#FF9800'; 

        document.querySelectorAll('.fish-body, .fish-tail-cone').forEach(part => {
          part.setAttribute('color', newColor);
        });

        if (warning) {
          warningLamp.setAttribute('color', '#ff1744');
          warningLamp.setAttribute('material', 'emissive', '#ff1744');
          arLabel.setAttribute('value', 'GOLDFISH\nSTATUS: WARNING');
          statusButton.textContent = 'เปลี่ยนเป็นปกติ';
        } else {
          warningLamp.setAttribute('color', '#00e676');
          warningLamp.setAttribute('material', 'emissive', '#00c853');
          arLabel.setAttribute('value', 'GOLDFISH\nSTATUS: NORMAL');
          statusButton.textContent = 'จำลองคำเตือน';
        }
      });
    });
  </script>
</head>

<body>
  <div id="top-panel">
    เล็งกล้องไปที่ Hiro Marker
    <span class="hint">อนุญาตให้เว็บไซต์ใช้กล้องเมื่อเบราว์เซอร์ถาม</span>
  </div>

  <div class="controls-container">
    <div class="sliders-panel">
      <div class="slider-row">
        <label>ปลา 1</label>
        <input type="range" id="speed1" min="0" max="250" value="110">
      </div>
      <div class="slider-row">
        <label>ปลา 2</label>
        <input type="range" id="speed2" min="0" max="250" value="70">
      </div>
      <div class="slider-row">
        <label>ปลา 3</label>
        <input type="range" id="speed3" min="0" max="250" value="130">
      </div>
    </div>
    <div class="main-buttons">
      <button id="run-button" type="button">หยุดว่ายน้ำ</button>
      <button id="status-button" type="button">จำลองคำเตือน</button>
    </div>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true"
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false"
  >
    <a-marker
      id="hiro-marker"
      preset="hiro"
      emitevents="true"
      smooth="true"
      smooth-count="8"
      smooth-tolerance="0.01"
      smooth-threshold="3"
    >
      <!-- ฐานบ่อน้ำจำลอง (ปรับขนาดให้กระชับพอดีหน้าจอ) -->
      <a-cylinder
        position="0 0.04 0"
        radius="0.6"
        height="0.04"
        color="#0288d1"
        roughness="0.2"
        opacity="0.75"
      ></a-cylinder>

      <!-- ปลาตัวที่ 1 -->
      <a-entity id="fish1" class="fish-entity" position="0.1 0.25 0.1" scale="0.5 0.5 0.5" screen-bounded-swim="speed: 110" fish-animation="speed: 110">
        <a-sphere class="fish-body" position="0 0 0" radius="0.4" scale="0.35 0.6 1" color="#FF9800"></a-sphere>
        <a-entity class="tail-pivot" position="0 0 0.35">
          <a-cone class="fish-tail-cone" position="0 0 0.15" rotation="-90 0 0" radius-bottom="0.25" radius-top="0.02" height="0.3" color="#FF9800" scale="0.3 1 1"></a-cone>
        </a-entity>
        <a-sphere position="-0.12 0.1 -0.2" radius="0.06" color="#ffffff"><a-sphere position="-0.02 0 -0.04" radius="0.03" color="#000000"></a-sphere></a-sphere>
        <a-sphere position="0.12 0.1 -0.2" radius="0.06" color="#ffffff"><a-sphere position="0.02 0 -0.04" radius="0.03" color="#000000"></a-sphere></a-sphere>
      </a-entity>

      <!-- ปลาตัวที่ 2 -->
      <a-entity id="fish2" class="fish-entity" position="-0.2 0.35 -0.1" scale="0.6 0.6 0.6" screen-bounded-swim="speed: 70" fish-animation="speed: 70">
        <a-sphere class="fish-body" position="0 0 0" radius="0.4" scale="0.35 0.6 1" color="#FF9800"></a-sphere>
        <a-entity class="tail-pivot" position="0 0 0.35">
          <a-cone class="fish-tail-cone" position="0 0 0.15" rotation="-90 0 0" radius-bottom="0.25" radius-top="0.02" height="0.3" color="#FF9800" scale="0.3 1 1"></a-cone>
        </a-entity>
        <a-sphere position="-0.12 0.1 -0.2" radius="0.06" color="#ffffff"><a-sphere position="-0.02 0 -0.04" radius="0.03" color="#000000"></a-sphere></a-sphere>
        <a-sphere position="0.12 0.1 -0.2" radius="0.06" color="#ffffff"><a-sphere position="0.02 0 -0.04" radius="0.03" color="#000000"></a-sphere></a-sphere>
      </a-entity>

      <!-- ปลาตัวที่ 3 -->
      <a-entity id="fish3" class="fish-entity" position="0.15 0.2 -0.2" scale="0.55 0.55 0.55" screen-bounded-swim="speed: 130" fish-animation="speed: 130">
        <a-sphere class="fish-body" position="0 0 0" radius="0.4" scale="0.35 0.6 1" color="#FF9800"></a-sphere>
        <a-entity class="tail-pivot" position="0 0 0.35">
          <a-cone class="fish-tail-cone" position="0 0 0.15" rotation="-90 0 0" radius-bottom="0.25" radius-top="0.02" height="0.3" color="#FF9800" scale="0.3 1 1"></a-cone>
        </a-entity>
        <a-sphere position="-0.12 0.1 -0.2" radius="0.06" color="#ffffff"><a-sphere position="-0.02 0 -0.04" radius="0.03" color="#000000"></a-sphere></a-sphere>
        <a-sphere position="0.12 0.1 -0.2" radius="0.06" color="#ffffff"><a-sphere position="0.02 0 -0.04" radius="0.03" color="#000000"></a-sphere></a-sphere>
      </a-entity>

      <!-- Status lamp -->
      <a-sphere
        id="warning-lamp"
        position="0 0.85 0"
        radius="0.06"
        color="#00e676"
        material="emissive: #00c853; emissiveIntensity: 0.8"
      ></a-sphere>

      <!-- AR information label -->
      <a-text
        id="ar-label"
        value="GOLDFISH\nSTATUS: NORMAL"
        position="0 1.05 0"
        rotation="-90 0 0"
        align="center"
        width="2.0"
        color="#ffffff"
        side="double"
      ></a-text>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
